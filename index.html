<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أميمة & أشرف</title>
<meta name="theme-color" content="#c98487">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--rose:#c98286;--rose2:#e9b9b7;--cream:#fff9f6;--ink:#563534;--gold:#b4874a;--card:#fff;--line:#edd7d3;--page:#eadfdb;--soft:#f1ddda;--softink:#70423f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#2a1d1d;--ink:#f3e3e0;--card:#382626;--line:#553838;--page:#171010;--soft:#4a3030;--softink:#f0d5d1;--gold:#d9b06f}}
:root[data-theme="dark"]{--cream:#2a1d1d;--ink:#f3e3e0;--card:#382626;--line:#553838;--page:#171010;--soft:#4a3030;--softink:#f0d5d1;--gold:#d9b06f}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Cairo,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{width:min(480px,100%);margin:auto;background:var(--cream);min-height:100vh;box-shadow:0 0 45px #0002;position:relative;overflow:hidden}
section{display:none;min-height:100vh;padding:28px 20px 90px;position:relative}
section.on{display:block;animation:in .5s ease}
#opening.on,#main.on{display:flex;align-items:center;justify-content:center;text-align:center}
@keyframes in{from{opacity:0}to{opacity:1}}
h1{font:700 30px Amiri,serif;margin:10px 0;line-height:1.6}
.ar{font-family:Amiri,serif}
.center{text-align:center}.muted{opacity:.8;font-size:14px;line-height:1.9}.gold{color:var(--gold)}
.logo{font-size:13px;font-weight:600;color:var(--gold)}
.btn{border:0;border-radius:30px;padding:13px 20px;font:700 14px Cairo,sans-serif;cursor:pointer;text-decoration:none;display:block;text-align:center;margin:10px 0;width:100%}
.btn:focus-visible,.back:focus-visible,.langbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{background:var(--rose);color:#fff;box-shadow:0 8px 20px #c9828640}.secondary{background:var(--soft);color:var(--softink)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back{border:0;background:none;font-size:22px;color:var(--ink);cursor:pointer;padding:4px 8px}
.langbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--gold);background:var(--card);color:var(--gold);font:700 14px Cairo,sans-serif;z-index:20;cursor:pointer;box-shadow:0 6px 20px #0002}
#opening{background:radial-gradient(circle at 50% 35%,var(--cream),#f7e7e3 70%,#ecd2ce)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #opening{background:radial-gradient(circle at 50% 35%,#3a2828,#241818)}}
.env{width:290px;height:195px;background:#f3d9d5;position:relative;margin:26px auto 34px;border-radius:10px;box-shadow:0 18px 45px #70403b30;perspective:800px;direction:ltr}
.env .front{position:absolute;inset:0;background:#fff0ed;clip-path:polygon(0 100%,0 40%,50% 86%,100% 40%,100% 100%);border-radius:0 0 10px 10px;z-index:2}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#e8c4bf;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:4}
.env .card-in{position:absolute;left:10%;right:10%;top:10%;height:80%;background:#fff;border-radius:6px;transition:transform .9s ease .5s;z-index:1;display:grid;place-items:center;color:#563534;font:700 30px Amiri,serif}
.seal{position:absolute;z-index:5;left:50%;top:52%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:#fff;font-size:28px;box-shadow:0 5px 15px #0003;transition:opacity .3s}
.opened .flap{transform:rotateX(180deg);z-index:0}.opened .seal{opacity:0}.opened .card-in{transform:translateY(-70px)}
.guest{font:700 24px Amiri,serif;color:var(--rose);min-height:36px}
.hero{background:linear-gradient(var(--cream),#f6e3df)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(#2a1d1d,#3a2626)}}
.names{font:700 46px/1.3 Amiri,serif;color:var(--rose);margin:6px 0}
.date{margin:14px 0;font-weight:700;font-size:16px}
.count{display:flex;justify-content:center;gap:8px;margin:18px 0}
.count div{background:var(--card);border-radius:12px;padding:10px 6px;min-width:64px;border:1px solid var(--line)}
.count strong{display:block;font-size:20px}.count span{font-size:11px;opacity:.7}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:var(--rose2);border-radius:80% 0 80% 0;opacity:.7;animation:fall linear infinite;pointer-events:none;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg) translateX(40px)}}
.cards{display:grid;gap:12px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:15px;line-height:1.8}
.card b{display:block;margin-bottom:4px}
.quote{font:400 20px/1.9 Amiri,serif;text-align:center;margin:8px 0 22px}
.timeline{border-inline-start:2px solid var(--rose2);margin:22px 8px;padding-inline-start:22px}
.event{position:relative;margin:0 0 24px;font-size:15px}
.event:before{content:"";position:absolute;inset-inline-start:-30px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--rose)}
.map{display:block;height:200px;border-radius:18px;background:#e8e3db;position:relative;overflow:hidden;margin:16px 0;text-decoration:none}
.road{position:absolute;height:4px;background:#bbb3a8;transform:rotate(-12deg);left:-20%;right:-20%;top:40%;box-shadow:0 70px #bbb3a8,0 -70px #bbb3a8}
.pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:46px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#fff;color:#563534;font:700 12px Cairo;padding:6px 12px;border-radius:20px;box-shadow:0 3px 10px #0002;white-space:nowrap}
label{font-size:13px;font-weight:700}
input,textarea,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:15px Cairo,sans-serif;margin:6px 0 14px}
.success{display:none;background:#edf6e9;padding:14px;border-radius:14px;color:#386235;margin-top:12px;font-size:14px}
.err{color:#b3261e;font-size:13px;min-height:16px;margin:-8px 0 8px}
footer{text-align:center;padding:24px 0 0;font-size:13px;opacity:.7}
.music{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--rose);color:#fff;z-index:20;box-shadow:0 6px 20px #0003;display:none;cursor:pointer}
html[lang="fr"] .ar,html[lang="fr"] h1,html[lang="fr"] .quote,html[lang="fr"] .names,html[lang="fr"] .guest{letter-spacing:.01em}
html[lang="fr"] .names{font-size:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<section id="opening" class="on">
<div style="position:relative;z-index:1;width:100%">
<div class="logo" data-k="logo"></div>
<div class="env" id="env"><div class="card-in" data-k="mono"></div><div class="front"></div><div class="flap"></div><div class="seal">♡</div></div>
<div class="guest" id="guest"></div>
<div class="ar" style="font-size:28px;font-weight:700" data-k="inv"></div>
<p class="muted" data-k="openHint"></p>
<button class="btn primary" onclick="openInvite()" data-k="openBtn"></button>
</div>
</section>

<section id="main" class="hero">
<div style="position:relative;z-index:1;width:100%">
<div class="gold" style="font-size:24px">✦</div>
<h1 class="ar" style="font-size:26px;font-weight:400" data-k="intro"></h1>
<div class="names" data-k="names"></div>
<div class="date" data-k="date"></div>
<p class="muted" data-k="joy"></p>
<div class="count">
<div><strong id="d">--</strong><span data-k="cd0"></span></div>
<div><strong id="h">--</strong><span data-k="cd1"></span></div>
<div><strong id="m">--</strong><span data-k="cd2"></span></div>
<div><strong id="s">--</strong><span data-k="cd3"></span></div>
</div>
<button class="btn primary" onclick="go('details')" data-k="discover"></button>
</div>
</section>

<section id="details">
<div class="nav"><b data-k="names"></b><button class="back" onclick="go('main')" aria-label="×">×</button></div>
<div class="center"><div class="logo" data-k="ourDay"></div><h1 data-k="details"></h1></div>
<p class="quote" data-k="quote"></p>
<div class="cards">
<div class="card"><b data-k="cDate"></b><span data-k="date"></span></div>
<div class="card"><b data-k="cTime"></b><span data-k="time"></span></div>
<div class="card"><b data-k="cPlace"></b><span data-k="hall"></span><br><span class="muted" data-k="hallHint"></span></div>
<div class="card"><b data-k="cDress"></b><span data-k="dress"></span></div>
</div>
<a class="btn primary" id="calBtn" target="_blank" rel="noopener" href="#" data-k="addCal"></a>
<button class="btn secondary" onclick="go('location')" data-k="seeLoc"></button>
<button class="btn secondary" onclick="go('program')" data-k="seeProg"></button>
<button class="btn secondary" onclick="go('rsvp')" data-k="rsvpBtn"></button>
</section>

<section id="location">
<div class="nav"><b data-k="navLoc"></b><button class="back" onclick="go('details')" data-k="back"></button></div>
<div class="center"><h1 data-k="meet"></h1><p class="muted" data-k="tapMap"></p></div>
<a class="map" target="_blank" rel="noopener" href="https://maps.app.goo.gl/cHp1ceQ9AWGagWha9"><div class="road"></div><div class="pin">📍</div><div class="tag" data-k="hall"></div></a>
<a class="btn primary" target="_blank" rel="noopener" href="https://maps.app.goo.gl/cHp1ceQ9AWGagWha9" data-k="openMaps"></a>
<button class="btn secondary" onclick="go('program')" data-k="toProg"></button>
</section>

<section id="program">
<div class="nav"><b data-k="navProg"></b><button class="back" onclick="go('details')" data-k="back"></button></div>
<div class="center"><div class="logo" data-k="progLogo"></div><h1 data-k="navProg"></h1></div>
<div class="timeline">
<div class="event"><b>14:00</b><br><span data-k="e1"></span></div>
<div class="event"><b>18:00</b><br><span data-k="e2"></span></div>
<div class="event"><b>20:00</b><br><span data-k="e3"></span></div>
<div class="event"><b>22:00</b><br><span data-k="e4"></span></div>
<div class="event"><b>00:00</b><br><span data-k="e5"></span></div>
</div>
<button class="btn primary" onclick="go('rsvp')" data-k="rsvpBtn"></button>
</section>

<section id="rsvp">
<div class="nav"><b data-k="navRsvp"></b><button class="back" onclick="go('details')" data-k="back"></button></div>
<div class="center"><div class="logo" data-k="rsvpLogo"></div><h1 data-k="rsvpTitle"></h1><p class="muted" data-k="deadline"></p></div>
<label for="name" data-k="lName"></label><input id="name" data-ph="phName" autocomplete="name">
<div class="err" id="err"></div>
<label for="answer" data-k="lAns"></label><select id="answer"><option data-k="o1"></option><option data-k="o2"></option></select>
<label for="people" data-k="lPeople"></label><input id="people" type="number" inputmode="numeric" min="1" max="10" value="1">
<label for="msg" data-k="lMsg"></label><textarea id="msg" rows="4" data-ph="phMsg"></textarea>
<button class="btn primary" onclick="rsvp()" data-k="sendWa"></button>
<button class="btn secondary" onclick="share()" data-k="share"></button>
<div id="success" class="success" data-k="ok"></div>
<footer data-k="thanks"></footer>
</section>

</div>
<button class="langbtn" id="langBtn" onclick="toggleLang()"></button>
<button class="music" id="musicBtn" onclick="toggleMusic()" aria-label="♪">♪</button>
<audio id="audio" loop></audio>

<script>
var PHONE="212752122418";
var AUDIO_SRC="music.aac";
var WEDDING=new Date("2026-10-10T14:00:00");

var T={

navProg:"البرنامج",progLogo:"سهرة نتقاسمها معًا",e1:"استقبال الضيوف",e2:"المراسم",e3:"العشاء",e4:"سهرة موسيقية",e5:"نهاية الحفل",

var L="ar",guestName="";

function applyLang(l){
  L=l;var t=T[l],h=document.documentElement;
  h.lang=l;h.dir=l==="ar"?"rtl":"ltr";document.title=t.title;
  document.querySelectorAll('[data-k]').forEach(function(e){e.innerHTML=t[e.getAttribute('data-k')]});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=t[e.getAttribute('data-ph')]});
  document.querySelectorAll('.back').forEach(function(b){if(b.dataset.k!==undefined||b.hasAttribute('data-k'))return});
  document.getElementById('langBtn').textContent=t.toggle;
  document.getElementById('guest').textContent=guestName?t.hi+guestName:'';
  document.getElementById('calBtn').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.calTitle)+'&dates=20261010T140000/20261011T000000&details='+encodeURIComponent(t.calDet)+'&location='+encodeURIComponent(t.calLoc);
  try{localStorage.setItem('lang',l)}catch(e){}
}
function toggleLang(){applyLang(L==="ar"?"fr":"ar")}

function go(id){
  document.querySelectorAll('section').forEach(function(x){x.classList.remove('on')});
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0});
}
function openInvite(){
  document.getElementById('env').classList.add('opened');
  if(AUDIO_SRC){try{document.getElementById('audio').play()}catch(e){}}
  setTimeout(function(){go('main')},1700);
}
function tick(){
  var x=Math.max(0,WEDDING-new Date());
  var d=Math.floor(x/864e5),h=Math.floor(x/36e5)%24,m=Math.floor(x/6e4)%60,s=Math.floor(x/1e3)%60;
  var p=function(n){return String(n).padStart(2,'0')};
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=p(h);
  document.getElementById('m').textContent=p(m);
  document.getElementById('s').textContent=p(s);
}
setInterval(tick,1000);tick();

(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var host=document.getElementById('main');
  for(var i=0;i<14;i++){
    var p=document.createElement('i');p.className='petal';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(9+Math.random()*9)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';
    host.appendChild(p);
  }
})();

// Lien personnalisé : ?invite=Nom  |  langue : ?lang=fr ou ?lang=ar
(function(){
  var l="ar";
  try{
    var q=new URLSearchParams(location.search);
    guestName=q.get('invite')||"";
    if(guestName)document.getElementById('name').value=guestName;
    var ql=q.get('lang'),sl=null;
    try{sl=localStorage.getItem('lang')}catch(e){}
    l=(ql==='fr'||ql==='ar')?ql:(sl==='fr'||sl==='ar')?sl:"ar";
  }catch(e){}
  applyLang(l);
})();

function rsvp(){
  var t=T[L],n=document.getElementById('name').value.trim();
  if(!n){document.getElementById('err').textContent=t.errName;document.getElementById('name').focus();return}
  document.getElementById('err').textContent='';
  var a=document.getElementById('answer').value;
  var p=document.getElementById('people').value||1;
  var msg=document.getElementById('msg').value.trim()||'-';
  var text=t.wa+'\n\n'+t.wName+': '+n+'\n'+t.wAns+': '+a+'\n'+t.wCount+': '+p+'\n'+t.wMsg+': '+msg;
  window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(text),'_blank');
  document.getElementById('success').style.display='block';
}
function share(){
  var t=T[L],u=location.href.split('?')[0]+'?lang='+L;
  if(navigator.share){navigator.share({title:t.shareTitle,text:t.shareTxt,url:u}).catch(function(){})}
  else{window.open('https://wa.me/?text='+encodeURIComponent(t.shareTxt+' '+u),'_blank')}
}
if(AUDIO_SRC){document.getElementById('audio').src=AUDIO_SRC;document.getElementById('musicBtn').style.display='block'}
function toggleMusic(){var a=document.getElementById('audio');a.paused?a.play():a.pause()}
